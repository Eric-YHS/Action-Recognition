name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile prototype sources
        run: python -m compileall -q camera_pose_prototype

      - name: Validate action templates and model asset
        run: |
          python - <<'PY'
          import json, pathlib, sys

          root = pathlib.Path("camera_pose_prototype")
          templates = sorted((root / "data" / "templates").glob("action_*.json"))
          if not templates:
              sys.exit("data/templates 下没有模板，请先运行 build_templates.py")
          for path in templates:
              data = json.loads(path.read_text(encoding="utf-8"))
              for key in ("action_id", "action_name", "template_length", "feature_dim", "sequence"):
                  if key not in data:
                      sys.exit(f"{path} 缺少字段 {key}")
              length, dim = data["template_length"], data["feature_dim"]
              for key in ("sequence", "mirror_sequence"):
                  seq = data[key]
                  if len(seq) != length:
                      sys.exit(f"{path} 的 {key} 长度 {len(seq)} 与 template_length {length} 不一致")
                  if any(len(f) != dim for f in seq):
                      sys.exit(f"{path} 的 {key} 存在维度不等于 feature_dim({dim}) 的帧")
              for key in ("start_pose", "end_pose", "mirror_start_pose", "mirror_end_pose"):
                  if len(data[key]) != dim:
                      sys.exit(f"{path} 的 {key} 维度与 feature_dim 不一致")
              if not data["match_threshold"] > 0:
                  sys.exit(f"{path} 的 match_threshold 异常")
          model = root / "data" / "models" / "pose_landmarker_lite.task"
          if not model.is_file() or model.stat().st_size < 1_000_000:
              sys.exit("缺少 pose_landmarker_lite.task 模型文件")
          print(f"ok: {len(templates)} 个模板，模型 {model.stat().st_size} 字节")
          PY

      - name: Validate vendored notebook JSON
        run: |
          python - <<'PY'
          import json, pathlib

          path = next(pathlib.Path("IndoorHIIT-activity-recognition-master").rglob("*.ipynb"))
          nb = json.loads(path.read_text(encoding="utf-8"))
          assert "cells" in nb, f"{path} 不是有效的 notebook"
          print(f"ok: {path.name} 共 {len(nb['cells'])} 个 cell")
          PY

      - name: Fail on unexpectedly large tracked files
        run: |
          set -euo pipefail
          # 仓库里有视频、模型和论文 PDF，体积可控；这条检查防止再误提交更大的中间产物
          limit=$((20 * 1024 * 1024))
          status=0
          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$(($size / 1024 / 1024))MB 入库文件：$file"
              status=1
            fi
          done < <(git ls-files -z)
          exit $status

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
